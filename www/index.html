<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #eef3ff;
      color: #1f2937;
    }

    header {
      background: #1e40af;
      color: white;
      padding: 20px 8%;
      text-align: center;
    }

    main {
      width: min(900px, 90%);
      margin: 35px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .profile-picture {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #2563eb;
}
    

    h1, h2, h3 {
      margin-top: 0;
    }

    .details p {
      margin: 8px 0;
      font-size: 17px;
    }

    .label {
      font-weight: bold;
      color: #1e40af;
    }

    .skills-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .skill {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .edit-btn, .save-btn {
      background: #2563eb;
      color: white;
    }

    .edit-btn:hover, .save-btn:hover {
      background: #1d4ed8;
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #374151;
      margin-left: 8px;
    }

    .hidden {
      display: none;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .error-message {
      color: #b91c1c;
      background: #fee2e2;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>Student Profile</h1>
  </header>

  <main>
    <!-- PROFILE VIEW -->
    <section id="profileView">
      <div class="card">
        <div class="profile-top">
        <img src="img/ngo.jpg" alt="Student Profile Picture" class="profile-picture">

          <div class="details">
            <h2 id="displayName">Your Name</h2>
            <p><span class="label">Course:</span> <span id="displayCourse"></span></p>
            <p><span class="label">Year Level:</span> <span id="displayYear"></span></p>
          </div>
        </div>

        <br />
        <button class="edit-btn" id="editButton">Edit Profile</button>
      </div>

      <div class="card">
        <h2>About</h2>
        <p id="displayAbout"></p>
      </div>

      <div class="card">
        <h2>Skills</h2>
        <div class="skills-list" id="displaySkills"></div>
      </div>

      <div class="card">
        <h2>Contact</h2>
        <p>Email: kylekirbyngo@email.com</p>
        <p>Phone: +63 961 964 015</p>
      </div>
    </section>

    <!-- EDIT PROFILE FORM -->
    <section id="editView" class="hidden">
      <div class="card">
        <h2>Edit Profile</h2>
        <p id="errorMessage" class="error-message hidden"></p>

        <form id="profileForm">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" />

          <label for="course">Course</label>
          <input type="text" id="course" />

          <label for="yearLevel">Year Level</label>
          <input type="text" id="yearLevel" />

          <label for="about">About Me</label>
          <textarea id="about"></textarea>

          <label for="skills">Skills <small>(separate skills with commas)</small></label>
          <input type="text" id="skills" placeholder="Example: HTML, CSS, JavaScript" />

          <br /><br />
          <button type="submit" class="save-btn">Save</button>
          <button type="button" class="cancel-btn" id="cancelButton">Cancel</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Student Profile</p>
  </footer>

  <script>
    const storageKey = "studentProfile";

    const defaultProfile = {
      fullName: "KYLE KIRBY M. NGO",
      course: "BS Information Technology",
      yearLevel: "3th Year",
      about: "I am a motivated student who enjoys learning technology and building creative projects and other stuff that about tech and something personal wants.",
      skills: ["HTML", "CSS", "JavaScript"]
    };

    let profileData;

    function loadProfile() {
      const savedProfile = localStorage.getItem(storageKey);

      if (savedProfile) {
        profileData = JSON.parse(savedProfile);
      } else {
        profileData = defaultProfile;
      }

      displayProfile();
    }

    function displayProfile() {
      document.getElementById("displayName").textContent = profileData.fullName;
      document.getElementById("displayCourse").textContent = profileData.course;
      document.getElementById("displayYear").textContent = profileData.yearLevel;
      document.getElementById("displayAbout").textContent = profileData.about;

      const skillsContainer = document.getElementById("displaySkills");
      skillsContainer.innerHTML = "";

      profileData.skills.forEach(skill => {
        const skillElement = document.createElement("span");
        skillElement.className = "skill";
        skillElement.textContent = skill;
        skillsContainer.appendChild(skillElement);
      });
    }

    function showEditForm() {
      document.getElementById("fullName").value = profileData.fullName;
      document.getElementById("course").value = profileData.course;
      document.getElementById("yearLevel").value = profileData.yearLevel;
      document.getElementById("about").value = profileData.about;
      document.getElementById("skills").value = profileData.skills.join(", ");

      document.getElementById("errorMessage").classList.add("hidden");
      document.getElementById("profileView").classList.add("hidden");
      document.getElementById("editView").classList.remove("hidden");
    }

    function closeEditForm() {
      document.getElementById("editView").classList.add("hidden");
      document.getElementById("profileView").classList.remove("hidden");
    }

    document.getElementById("editButton").addEventListener("click", showEditForm);

    document.getElementById("cancelButton").addEventListener("click", () => {
      // No data is saved when Cancel is selected
      closeEditForm();
    });

    document.getElementById("profileForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const course = document.getElementById("course").value.trim();
      const yearLevel = document.getElementById("yearLevel").value.trim();
      const about = document.getElementById("about").value.trim();
      const skillsInput = document.getElementById("skills").value.trim();

      const errorMessage = document.getElementById("errorMessage");

      // JavaScript validation
      if (!fullName || !course || !yearLevel || !about) {
        errorMessage.textContent = "Please complete all required fields.";
        errorMessage.classList.remove("hidden");
        return;
      }

      const skillsArray = skillsInput
        ? skillsInput.split(",").map(skill => skill.trim()).filter(skill => skill !== "")
        : [];

      // Save updated profile to localStorage
      profileData = {
        fullName: fullName,
        course: course,
        yearLevel: yearLevel,
        about: about,
        skills: skillsArray
      };

      localStorage.setItem(storageKey, JSON.stringify(profileData));

      // Update profile immediately
      displayProfile();
      closeEditForm();
    });

    // Retrieve saved data or show default profile on startup
    loadProfile();
  </script>

</body>
</html>
